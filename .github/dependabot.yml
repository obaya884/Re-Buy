# Dependabot のバージョン更新設定。趣味ペースなので weekly。
# 更新 PR は CI（.github/workflows/ci.yml）が検証する。マージは手動

version: 2
updates:
  # Gradle の依存（gradle/libs.versions.toml と build.gradle.kts）
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # マイナー・パッチ更新はまとめて 1 つの PR にする
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions（.github/workflows/*）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
