name: CI

# PR と main への push で docs の機械検査と、build（lint・unit test）と
# instrumented（Gradle Managed Device）を別ジョブで並列に回す。
# マージは手動（docs/仕様/16_git運用定義書.md §1.3）。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # docs の機械検査。JDK も Gradle も要らないので他のジョブとは別に並列で回す
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/docs-check.sh

  # lint・unit test・debug/release の assemble
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: androidApp/build/reports/

  # Gradle Managed Device でのインストルメンテーションテスト。build とは独立に並列で走る
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # エミュレータのハードウェアアクセラレーション。ubuntu-latest は KVM を持つが
      # 既定では runner ユーザーが /dev/kvm を開けない
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ランナーには GPU が無いのでソフトウェアレンダリングを指定する
      - name: Instrumented tests (Gradle Managed Device)
        run: ./gradlew pixel6Api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            androidApp/build/outputs/androidTest-results/
            androidApp/build/reports/androidTests/
