name: CI

# PR と main への push で docs の機械検査と、build（lint・unit test 込み）＋
# インストルメンテーションテスト（Gradle Managed Device）を回す。
# マージは手動（docs/仕様/16_git運用定義書.md §1.3）。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # docs の機械検査。JDK も Gradle も要らないので verify とは別ジョブで並列に回す
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/docs-check.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # lint・unit test・debug/release の assemble を含む
      - run: ./gradlew build

      # actions/cache の path に環境変数を渡すため、ランナーの ANDROID_HOME を env コンテキストへ写す
      - name: Resolve system image path
        run: echo "SYSIMG=$ANDROID_HOME/system-images/android-35/aosp_atd/x86_64" >> "$GITHUB_ENV"

      # GMD のシステムイメージ（約 500MB）を実行間で使い回す。
      # キーはイメージ名で固定——イメージの更新はキーを変えて行う
      - name: Cache GMD system image
        uses: actions/cache@v6
        with:
          path: ${{ env.SYSIMG }}
          key: gmd-system-image-android-35-aosp_atd-x86_64

      # エミュレータのハードウェアアクセラレーション。ubuntu-latest は KVM を持つが
      # 既定では runner ユーザーが /dev/kvm を開けない
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ランナーには GPU が無いのでソフトウェアレンダリングを指定する
      - name: Instrumented tests (Gradle Managed Device)
        run: ./gradlew pixel6Api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
