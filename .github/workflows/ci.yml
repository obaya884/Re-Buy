name: CI

# PR と main への push で docs の機械検査と、build（lint・unit test）と
# instrumented（Gradle Managed Device）と ios（Kotlin/Native と Xcode）を
# 別ジョブで並列に回す。マージは手動（docs/仕様/16_git運用定義書.md §1.3）。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # docs の機械検査。JDK も Gradle も要らないので他のジョブとは別に並列で回す
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/docs-check.sh

  # lint・unit test・debug/release の assemble
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      # aboutlibraries.json と shared/data/schemas はビルドで再生成される生成物を
      # コミットしている。再生成し忘れがここで止まる
      - name: 生成物が最新かを見る
        run: git diff --exit-code

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            androidApp/build/reports/
            shared/*/build/reports/

  # Gradle Managed Device でのインストルメンテーションテスト。build とは独立に並列で走る
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # エミュレータのハードウェアアクセラレーション。ubuntu-latest は KVM を持つが
      # 既定では runner ユーザーが /dev/kvm を開けない
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ランナーには GPU が無いのでソフトウェアレンダリングを指定する
      - name: Instrumented tests (Gradle Managed Device)
        run: ./gradlew pixel6Api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            androidApp/build/outputs/androidTest-results/
            androidApp/build/reports/androidTests/

  # Kotlin/Native のテストと iOS アプリのビルド。macOS でしか走らない。
  # Linux の build ジョブは iOS のタスクを落とすのではなく「このホストでは走らない」と
  # 警告を出して素通りするので、ここが無いと iOS のコンパイルエラーが CI をすり抜ける
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # commonTest と iosTest。シミュレータ上で走る
      - name: iOS のユニットテスト
        run: ./gradlew iosSimulatorArm64Test

      # Swift 側（iOSApp.swift / ContentView.swift）が壊れていないかを見る。
      # Xcode の run script phase が framework のリンクも走らせるので、
      # linkDebugFrameworkIosSimulatorArm64 はこれに含まれる
      # テストが落ちても走らせる。1 回の実行で「Kotlin 側」と「Swift 側」の両方の
      # 結果が要る。Kotlin/Native のコンパイルは上のステップで済んでいるので、
      # ここは 1 分もかからない（ジョブを分けると逆に 5〜8 分のコンパイルが二重になる）
      - name: iOS アプリのビルド
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: shared/*/build/reports/
